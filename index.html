
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pamiętamy</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at center,
                #29231e 0%, #151313 45%, #080808 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: Georgia, serif;
            color: #f5e6c8;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 42px;
            letter-spacing: 8px;
            font-weight: normal;
            margin-bottom: 20px;
            text-shadow: 0 0 15px #d69b43;
        }

        .candle {
            position: relative;
            width: 120px;
            height: 190px;
            background: linear-gradient(
                90deg, #791b12, #d94b32, #8c2118
            );
            border-radius: 15px 15px 8px 8px;
            box-shadow: 0 0 35px #d84b23;
            margin-top: 100px;
        }

        .candle::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 20px;
            background: #e96c4c;
            border-radius: 50%;
            top: -10px;
        }

        .candle::after {
            content: "";
            position: absolute;
            width: 4px;
            height: 30px;
            background: #25201b;
            top: -30px;
            left: 58px;
        }

        .flame {
            position: absolute;
            width: 35px;
            height: 65px;
            background: linear-gradient(
                to top, #ff5a00, #ffb000, #fff2a6
            );
            border-radius: 50% 50% 40% 40%;
            top: -90px;
            left: 42px;
            transform-origin: bottom center;
            box-shadow:
                0 0 20px #ff9d00,
                0 0 45px #ff5a00,
                0 0 80px #ff8c00;
            animation: flicker 0.8s infinite alternate;
        }

        .flame::after {
            content: "";
            position: absolute;
            width: 13px;
            height: 30px;
            background: #fff5cf;
            border-radius: 50%;
            top: 25px;
            left: 11px;
        }

        @keyframes flicker {
            0% {
                transform: rotate(-5deg) scale(1);
                opacity: 0.9;
            }
            50% {
                transform: rotate(4deg) scale(1.08, 0.95);
                opacity: 1;
            }
            100% {
                transform: rotate(-3deg) scale(0.95, 1.05);
                opacity: 0.85;
            }
        }

        .base {
            width: 170px;
            height: 15px;
            background: linear-gradient(
                #c49a55, #755025
            );
            border-radius: 50%;
            margin-top: 5px;
            box-shadow: 0 0 20px #d69b43;
        }

        .message {
            margin-top: 55px;
            text-align: center;
            font-size: 21px;
            line-height: 1.8;
            color: #d9c7a5;
            font-style: italic;
            text-shadow: 0 0 10px #c18a40;
        }

        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 12px;
            color: #81766a;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>PAMIĘTAMY</h1>

        <div class="candle">
            <div class="flame"></div>
        </div>

        <div class="base"></div>

        <p class="message">
            „Nie umiera ten, kto pozostaje<br>
            w sercach i pamięci bliskich.”
        </p>

    </div>

    <div class="footer">
        PAMIĘĆ • MIŁOŚĆ • WSPOMNIENIA
    </div>

</body>
</html>
